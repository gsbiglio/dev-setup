---
- name: Development machine setup
  hosts: local
  gather_facts: true

  vars:
    homebrew_prefix: "{{ '/opt/homebrew' if ansible_facts['machine'] == 'arm64' else '/usr/local' }}"

  pre_tasks:
    - name: Require macOS
      ansible.builtin.assert:
        that: ansible_facts['system'] == "Darwin"
        fail_msg: This playbook only supports macOS.

    - name: Require Homebrew
      ansible.builtin.stat:
        path: "{{ homebrew_prefix }}/bin/brew"
      register: brew_binary

    - name: Fail if Homebrew is missing
      ansible.builtin.fail:
        msg: Run ./bootstrap.sh to install Homebrew and Ansible first.
      when: not brew_binary.stat.exists

    - name: Check Xcode Command Line Tools
      ansible.builtin.command: xcode-select -p
      register: xcode_clt
      changed_when: false
      failed_when: false

    - name: Fail if Xcode Command Line Tools are missing
      ansible.builtin.fail:
        msg: >-
          Xcode Command Line Tools are required. Run: xcode-select --install
      when: xcode_clt.rc != 0

  tasks:
    - name: Add Homebrew taps
      community.general.homebrew_tap:
        name: "{{ item }}"
        state: present
      loop: "{{ homebrew_taps }}"

    - name: Trust third-party Homebrew formulas
      ansible.builtin.command:
        argv:
          - brew
          - trust
          - --formula
          - "{{ item }}"
      environment:
        PATH: "{{ homebrew_prefix }}/bin:{{ ansible_env.PATH }}"
      loop: "{{ homebrew_trusted_formulas }}"
      changed_when: false

    - name: Install Homebrew formulas
      community.general.homebrew:
        name: "{{ item }}"
        state: present
        update_homebrew: "{{ ansible_loop.first }}"
      loop: "{{ homebrew_formulas }}"
      loop_control:
        extended: true

    - name: Install Homebrew casks
      community.general.homebrew_cask:
        name: "{{ item }}"
        state: present
        sudo_password: "{{ homebrew_sudo_password }}"
      loop: "{{ homebrew_casks }}"
      no_log: true

    - name: Install Python versions with uv
      ansible.builtin.command:
        argv:
          - uv
          - python
          - install
          - "{{ item }}"
      register: uv_python_install_result
      changed_when: uv_python_install_result.stdout is search('Installed Python')
      environment:
        PATH: "{{ homebrew_prefix }}/bin:{{ ansible_env.PATH }}"
      loop: "{{ python_versions }}"

    - name: Install global CLI tools with uv
      ansible.builtin.command:
        argv:
          - uv
          - tool
          - install
          - "{{ item }}"
      register: uv_tool_install_result
      changed_when: "'already installed' not in uv_tool_install_result.stdout"
      environment:
        PATH: "{{ homebrew_prefix }}/bin:{{ ansible_env.PATH }}"
      loop: "{{ uv_global_tools }}"

    - name: Configure shell PATH for Warp and zsh
      ansible.builtin.blockinfile:
        path: "{{ ansible_env.HOME }}/.zshrc"
        marker: "# >>> {mark} dev-setup >>>"
        block: |
          export PATH="{{ homebrew_prefix }}/bin:{{ homebrew_prefix }}/sbin:$PATH"
          export PATH="$HOME/.local/bin:$PATH"
        create: true

    - name: Ensure Neovim config directory exists
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.config/nvim"
        state: directory
        mode: "0755"

    - name: Deploy Neovim configuration
      ansible.builtin.copy:
        src: files/nvim/init.lua
        dest: "{{ ansible_env.HOME }}/.config/nvim/init.lua"
        mode: "0644"

    - name: Configure Dock orientation
      community.general.osx_defaults:
        domain: com.apple.dock
        key: orientation
        type: string
        value: "{{ macos_preferences.dock_orientation }}"
      notify: Restart Dock

    - name: Configure mouse and trackpad tracking speed
      community.general.osx_defaults:
        domain: "{{ item.domain }}"
        key: "{{ item.key }}"
        type: float
        value: "{{ macos_preferences.mouse_tracking_speed }}"
      loop:
        - { domain: NSGlobalDomain, key: com.apple.mouse.scaling }
        - { domain: com.apple.driver.AppleBluetoothMultitouch.mouse, key: MouseTrackingSpeed }
        - { domain: com.apple.driver.AppleBluetoothMultitouch.trackpad, key: MouseTrackingSpeed }
        - { domain: com.apple.AppleMultitouchTrackpad, key: MouseTrackingSpeed }
        - { domain: com.apple.AppleMultitouchMouse, key: MouseTrackingSpeed }

    - name: Configure enabled keyboard input sources
      community.general.osx_defaults:
        domain: com.apple.HIToolbox
        key: AppleEnabledInputSources
        type: array
        value: "{{ macos_preferences.keyboard_input_sources }}"

    - name: Set current keyboard layout to ABC
      community.general.osx_defaults:
        domain: com.apple.HIToolbox
        key: AppleCurrentKeyboardLayoutInputSourceID
        type: string
        value: com.apple.keylayout.ABC

    - name: Require password immediately after sleep or screen saver
      community.general.osx_defaults:
        domain: com.apple.screensaver
        key: askForPassword
        type: bool
        value: "{{ macos_preferences.require_password_on_wake }}"
      when: macos_preferences.require_password_on_wake

    - name: Set password grace period after screen lock
      community.general.osx_defaults:
        domain: com.apple.screensaver
        key: askForPasswordDelay
        type: int
        value: "{{ macos_preferences.require_password_delay_seconds }}"

    - name: Lock screen immediately on sleep
      community.general.osx_defaults:
        domain: com.apple.screensaver
        key: tokenRemovalAction
        type: int
        value: 0

    - name: Read Touch ID unlock setting
      ansible.builtin.command: bioutil -r
      register: bioutil_read
      changed_when: false
      when: macos_preferences.touch_id_unlock

    - name: Enable Touch ID for unlock
      ansible.builtin.command: bioutil -w -u 1
      when:
        - macos_preferences.touch_id_unlock
        - bioutil_read.stdout is not search('Biometrics for unlock: 1')

  handlers:
    - name: Restart Dock
      ansible.builtin.command: killall Dock
      changed_when: true
      failed_when: false
