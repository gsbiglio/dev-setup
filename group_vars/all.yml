---
homebrew_taps:
  - databricks/tap
  - anomalyco/tap
  - hashicorp/tap

# Homebrew 6+ requires trusting third-party tap formulae before install.
# Prefer formula-level trust over trusting entire taps.
homebrew_trusted_formulas:
  - databricks/tap/databricks
  - anomalyco/tap/opencode
  - hashicorp/tap/terraform

homebrew_formulas:
  - uv
  - postgresql@16
  - neovim
  - awscli
  - databricks
  - hashicorp/tap/terraform
  - terragrunt
  - opencode

homebrew_casks:
  - google-chrome
  - whatsapp
  - docker-desktop
  - linear
  - cursor
  - spotify
  - nordlayer
  - pritunl
  - notion
  - dbeaver-community
  - alt-tab
  - rectangle
  - tad
  - ollama
  - leapp
  - muesli
  - slack
  - warp

# macOS system preferences replicated from the reference machine.
macos_preferences:
  dock_orientation: left

  # Tracking speed uses macOS internal scale (typically 0.0-3.0).
  mouse_tracking_speed: 2.0

  keyboard_input_sources:
    - InputSourceKind: Keyboard Layout
      "KeyboardLayout ID": 252
      "KeyboardLayout Name": ABC
    - InputSourceKind: Keyboard Layout
      "KeyboardLayout ID": 89
      "KeyboardLayout Name": Latin American

  require_password_on_wake: true
  require_password_delay_seconds: 0
  touch_id_unlock: true

uv_global_tools:
  - ruff
  - bump-my-version
  - pre-commit

python_versions:
  - "3.9"
  - "3.10"
  - "3.11"
  - "3.12"
  - "3.13"
  - "3.14.5"
